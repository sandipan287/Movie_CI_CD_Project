apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: movie-frontend
  template:
    metadata:
      labels:
        app: movie-frontend
    spec:
      containers:
        - name: movie-frontend
          image: REPLACE_WITH_FRONTEND_ECR_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: movie-frontend
spec:
  selector:
    app: movie-frontend
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
