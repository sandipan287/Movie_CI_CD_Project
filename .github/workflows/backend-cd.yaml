name: Backend Continuous Deployment

on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint backend
        run: flake8 app.py tests

      - name: Test backend
        run: python -m pytest -q

      - name: Build backend image
        working-directory: .
        run: docker build -t movie-backend:latest ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure backend ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ secrets.ECR_BACKEND_REPOSITORY }}" \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ secrets.ECR_BACKEND_REPOSITORY }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}" \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Deploy backend to EKS
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml

      - name: Update backend image
        run: |
          kubectl set image deployment/movie-backend \
            movie-backend="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}"

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/movie-backend --timeout=180s

      - name: Show backend resources
        run: |
          kubectl get deployment movie-backend
          kubectl get service movie-backend